<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard -  Bali Global Kinder School</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand-logo">⚙️ Admin Dashboard</a>
            <ul class="nav-menu">
                <li><a href="/">Lihat Situs Web</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h2 class="section-title">Dashboard Pengelola Sekolah</h2>

        <section style="margin-bottom: 3rem;">
            <h3>Data Pendaftar SPMB 2026/2027</h3>
            <div class="table-responsive" style="margin-top:1rem;">
                <table>
                    <thead>
                        <tr>
                            <th>No. Pendaftaran</th>
                            <th>Nama Anak</th>
                            <th>Program</th>
                            <th>Orang Tua</th>
                            <th>Kontak</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="spmb-table-body"></tbody>
                </table>
            </div>
        </section>

        <section>
            <div class="grid">
                <div class="card">
                    <h3>Tambah Berita Baru</h3>
                    <form id="admin-news-form">
                        <div class="form-group">
                            <label>Judul Berita</label>
                            <input type="text" id="news_title" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Kategori</label>
                            <select id="news_category" class="form-control">
                                <option value="Pengumuman">Pengumuman</option>
                                <option value="Kegiatan">Kegiatan</option>
                                <option value="Prestasi">Prestasi</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ringkasan Singkat</label>
                            <input type="text" id="news_summary" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Isi Berita</label>
                            <textarea id="news_content" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Publikasikan Berita</button>
                    </form>
                </div>

                <div class="card">
                    <h3>Kelola Berita Aktif</h3>
                    <div id="admin-news-list" style="margin-top:1rem;"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026  Bali Global Kinder School. Admin Panel.</p>
    </footer>

    <script src="/js/site.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
